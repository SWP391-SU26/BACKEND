spring.application.name=courseqa-springboot-mvc2-skeleton
server.port=${SERVER_PORT:8081}

# Local SQL Server configuration.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=VietnameseCourseQA20DB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Database schema is managed by the SQL files in /database.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# Signed access tokens. Override JWT_SECRET outside local development.
app.jwt.secret=${JWT_SECRET:VGhpcy1pcy1hLWxvY2FsLWRldmVsb3BtZW50LWtleS1jaGFuZ2UtbWUtbm93LTIwMjY=}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Python AI service.
python.ai.service.url=${PYTHON_AI_SERVICE_URL:http://localhost:8001}
python.ai.service.benchmark-timeout-seconds=${PYTHON_AI_BENCHMARK_TIMEOUT_SECONDS:1800}
python.ai.service.finetuned-timeout-seconds=${PYTHON_AI_FINETUNED_TIMEOUT_SECONDS:180}

# Local file storage and optional Cloudinary integration.
app.upload-dir=${UPLOAD_DIR:uploads}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Optional mail settings for password recovery.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@courseqa.local}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
