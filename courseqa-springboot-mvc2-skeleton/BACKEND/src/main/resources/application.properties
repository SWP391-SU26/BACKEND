spring.application.name=courseqa-springboot-mvc2-skeleton
spring.config.import=optional:file:.env[.properties]
server.port=8080

# Signed access tokens. Set JWT_SECRET to a random base64 value of at least 32 bytes outside development.
app.jwt.secret=${JWT_SECRET:VGhpcy1pcy1hLWxvY2FsLWRldmVsb3BtZW50LWtleS1jaGFuZ2UtbWUtbm93LTIwMjY=}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# SQL Server configuration
# Change username/password according to your local SQL Server.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=VietnameseCourseQA20DB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sa12345
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Use SQL script in /database, do not auto-create tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# File upload
app.upload-dir=uploads

# Cloudinary document storage
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Mail settings for forgot password.
# Example Gmail values:
# MAIL_HOST=smtp.gmail.com
# MAIL_PORT=587
# MAIL_USERNAME=your_email@gmail.com
# MAIL_PASSWORD=your_app_password
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:shiyodasan@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:shiyodasan@gmail.com}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
