spring.application.name=courseqa-springboot-mvc2-skeleton
# Load local secrets when Maven is started from either the Java module or the BACKEND root.
spring.config.import=optional:file:.env[.properties],optional:file:../../.env[.properties]
server.port=${SERVER_PORT:8080}

# Local SQL Server configuration.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=VietnameseCourseQA20DB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:sa12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Database schema is managed by the SQL files in /database.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# Signed access tokens. Override JWT_SECRET outside local development.
app.jwt.secret=${JWT_SECRET:VGhpcy1pcy1hLWxvY2FsLWRldmVsb3BtZW50LWtleS1jaGFuZ2UtbWUtbm93LTIwMjY=}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Python AI service.
python.ai.service.url=${PYTHON_AI_SERVICE_URL:http://localhost:8001}
python.ai.service.chat-timeout-seconds=${PYTHON_AI_CHAT_TIMEOUT_SECONDS:112}
python.ai.service.embedding-timeout-seconds=${PYTHON_AI_EMBEDDING_TIMEOUT_SECONDS:600}
python.ai.service.benchmark-timeout-seconds=${PYTHON_AI_BENCHMARK_TIMEOUT_SECONDS:1800}
python.ai.service.finetuned-timeout-seconds=${PYTHON_AI_FINETUNED_TIMEOUT_SECONDS:180}

# Local file storage and optional Cloudinary integration.
app.upload-dir=${UPLOAD_DIR:uploads}
app.report-dir=${REPORT_DIR:reports/evaluation}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Tesseract OCR for scanned PDF pages. Point at the local tessdata folder
# (e.g. C:/Program Files/Tesseract-OCR/tessdata); OCR is skipped when unset.
app.ocr.tessdata-path=${OCR_TESSDATA_PATH:}
app.ocr.language=${OCR_LANGUAGE:vie+eng}
# Embedded DOCX/PPTX images are OCR'd only when the result looks trustworthy;
# raise this if decorative graphics start leaking noise into the index.
app.ocr.min-confidence=${OCR_MIN_CONFIDENCE:60}

# Chunking budgets, measured in the embedding model's own tokens. Tunable so the
# research team can sweep them without rebuilding. Changing these makes existing
# chunks stale: re-index a document to have it use the new values.
# Names are prefixed because Spring also imports BACKEND/.env, where CHUNK_SIZE and
# CHUNK_OVERLAP belong to the Python pipeline. Sharing those names let Python's
# settings silently drive Java's chunking even though the two use different
# tokenizers and mean different things.
app.chunking.size=${APP_CHUNKING_SIZE:450}
app.chunking.overlap=${APP_CHUNKING_OVERLAP:55}
# Slides hold short bullet text; packing them like prose would merge several slides.
app.chunking.slide-size=${APP_CHUNKING_SLIDE_SIZE:250}
app.chunking.slide-overlap=${APP_CHUNKING_SLIDE_OVERLAP:40}
# Leave blank to auto-discover BGE-M3's tokenizer in the shared model cache.
app.chunking.tokenizer-path=${APP_CHUNKING_TOKENIZER_PATH:}
app.chunking.tokenizer-enabled=${APP_CHUNKING_TOKENIZER_ENABLED:true}

# Optional mail settings for password recovery.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@courseqa.local}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Semantic chunking: embeds every block to find topic shifts, then ends chunks
# there as well as at the size limit. Roughly triples embedding cost, so it is
# opt-in; the structural rules are the default and remain the fallback.
app.chunking.semantic-enabled=${APP_CHUNKING_SEMANTIC_ENABLED:false}
app.chunking.semantic-threshold=${APP_CHUNKING_SEMANTIC_THRESHOLD:0.62}
app.chunking.semantic-max-blocks=${APP_CHUNKING_SEMANTIC_MAX_BLOCKS:4000}

# Resumable uploads: clients send byte ranges and can continue after a drop.
# Kept equal to spring.servlet.multipart.max-file-size: the client picks the
# resumable path by file size, so a lower cap here would reject files the
# single-request path still accepts.
app.upload.max-bytes=${UPLOAD_MAX_BYTES:52428800}
app.upload.abandoned-after-hours=${UPLOAD_ABANDONED_AFTER_HOURS:24}
